name: Coletar preços do radar

on:
  schedule:
    # 08:00 em Brasília (UTC-3) durante o horário padrão.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Recuperar histórico dos snapshots versionados
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          merged = {}
          commits = subprocess.check_output(
              ['git', 'log', '--format=%H', '--', 'data/observations.json'],
              text=True,
          ).splitlines()
          for commit in commits:
              result = subprocess.run(
                  ['git', 'show', f'{commit}:data/observations.json'],
                  text=True, capture_output=True,
              )
              if result.returncode != 0:
                  continue
              try:
                  payload = json.loads(result.stdout)
              except json.JSONDecodeError:
                  continue
              for observation in payload.get('observations', []):
                  if observation.get('id'):
                      merged[observation['id']] = observation
          current = Path('data/observations.json')
          payload = json.loads(current.read_text(encoding='utf-8')) if current.exists() else {}
          for observation in payload.get('observations', []):
              if observation.get('id'):
                  merged[observation['id']] = observation
          rows = sorted(merged.values(), key=lambda row: (row.get('collectedAt', ''), row.get('id', '')))
          generated_at = payload.get('generatedAt')
          current.write_text(json.dumps({'generatedAt': generated_at, 'observations': rows}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          dates = sorted({row.get('collectedAt', '')[:10] for row in rows if row.get('collectedAt')})
          print(f'Histórico recuperado: {len(rows)} observações em {dates}')
          PY
      - name: Validar configuração Serper
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          if [ -z "$SERPER_API_KEY" ]; then
            echo "Configure SERPER_API_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Coletar preços via Serper Google Shopping
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python collector.py
      - name: Verificar preservação do histórico
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/observations.json').read_text(encoding='utf-8'))
          observations = payload.get('observations', [])
          dates = sorted({row.get('collectedAt', '')[:10] for row in observations if row.get('collectedAt')})
          print(f'Snapshot contém {len(observations)} observações em {dates}')
          if not observations:
              raise SystemExit('Snapshot sem observações; publicação bloqueada.')
          PY
      - name: Publicar snapshot preservando commits concorrentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/observations.json "$RUNNER_TEMP/observations-collected.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_snapshot.py \
              --collected "$RUNNER_TEMP/observations-collected.json" \
              --target data/observations.json
            git add data/observations.json

            if git diff --cached --quiet; then
              echo "Snapshot já está atualizado no main."
              exit 0
            fi

            git commit -m "Atualizar snapshot de preços"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "O main avançou durante o push (tentativa $attempt/5); buscando e mesclando novamente."
          done

          echo "Não foi possível publicar o snapshot após 5 tentativas." >&2
          exit 1
      - name: Publicar observações como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: observacoes-${{ github.run_id }}
          path: observations.jsonl
          if-no-files-found: warn
          retention-days: 30
